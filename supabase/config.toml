# Configuración mínima de la CLI de Supabase (no se usa Docker).
project_id = "navidad-en-familia"

[functions.create-member]
verify_jwt = true

[functions.reset-member-password]
verify_jwt = true

[functions.change-join-code]
verify_jwt = true

# Pública: la usan los familiares antes de tener sesión (valida enlace + palabra secreta).
[functions.family-access]
verify_jwt = false

# Google llama por GET sin sesión al volver de conectar el Drive; los POST verifican la sesión dentro.
[functions.google-drive]
verify_jwt = false

